<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Helper for solving sudoku variants" />
    <meta charset="utf-8">
    <title>Sudoku solver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Šimon Brecher">
    <link rel="icon" type="image/x-icon" href="images/favicon.png">

    <link rel="stylesheet" href="styles/puzzle.css">
    <link rel="stylesheet" href="styles/editor.css">

    <script src="src/editor.js"></script>

    <script src="src/editor/jigsawEditor.js"></script>

    <script src="src/control/builder.js"></script>
    <script src="src/control/renderer.js"></script>
    <script src="src/control/solver.js"></script>

    <script src="src/data/regions.js"></script>
    <script src="src/data/state.js"></script>
    <script src="src/data/sudoku.js"></script>

    <script src="src/graphics/basketBorderStyle.js"></script>
    <script src="src/graphics/canvas.js"></script>
    <script src="src/graphics/cell.js"></script>
    <script src="src/graphics/frame.js"></script>
    <script src="src/graphics/lineStyle.js"></script>

    <script src="src/utils/arrayUtils.js"></script>
    <script src="src/utils/binaryUtils.js"></script>
    <script src="src/utils/graphicsUtils.js"></script>
    <script src="src/utils/positionUtils.js"></script>
</head>

<body>

<div id="page-wrapper">
    <div class="menu">
        <div id="menu-button-resize" class="menu-button" onclick="MainEditor.pressedResizeButton();">Resize</div>
        <div id="menu-button-clear" class="menu-button" onclick="MainEditor.pressedClearButton();">Clear</div>
        <div id="menu-button-regions" class="menu-button" onclick="MainEditor.pressedRegionsButton();">Regions</div>
        <div id="menu-button-view" class="menu-button" onclick="MainEditor.pressedViewButton();">View</div>
    </div>
    <div id="container"></div>
    <div class="menu">
        <section id="menu-section-regions" class="menu-section">
            <div id="menu-button-regions-rectangular" class="menu-button" onclick="MainEditor.pressedRegionsRectangularButton();">
                <div>Rectangular</div>
                <div id="check-regions-rectangular" class="check"></div>
            </div>
            <div id="menu-button-regions-none" class="menu-button" onclick="MainEditor.pressedRegionsNoneButton();">
                <div>None</div>
                <div id="check-regions-none" class="check"></div>
            </div>
            <div id="menu-button-regions-jigsaw" class="menu-button" onclick="MainEditor.pressedRegionsJigsawButton();">
                <div>Jigsaw</div>
                <div id="check-regions-jigsaw" class="check"></div>
            </div>
            <div id="menu-button-regions-view" class="menu-button" onclick="MainEditor.pressedRegionsViewButton();">View</div>
        </section>
        <section id="menu-section-view" class="menu-section">
            <div id="menu-button-view-nothing" class="menu-button">...</div>
        </section>
    </div>
</div>

<div id="confirm-window-resize" class="confirm-window">
    <div class="confirm-text">Choose size of new sudoku</div>
    <div class="confirm-input-wrapper">
        <input type="number" id="resize-value" value="9" oninput="validateInputLength(this, 2);">
    </div>
    <div class="confirm-window-button-wrapper">
        <div class="confirm" onclick="MainEditor.confirmResize();">Confirm</div>
        <div class="cancel" onclick="MainEditor.cancelResize();">Cancel</div>
    </div>
</div>

<div id="confirm-window-regions-rectangular" class="confirm-window">
    <div class="confirm-text">Choose size of rectangles</div>
    <div class="confirm-input-wrapper">
        <select id="regions-rectangular-value"></select>
    </div>
    <div class="confirm-window-button-wrapper">
        <div class="confirm" onclick="MainEditor.confirmRegionsRectangular();">Confirm</div>
        <div class="cancel" onclick="MainEditor.cancelRegionsRectangular();">Cancel</div>
    </div>
</div>

<script>
    function validateInputLength(input, maximum) {
        if (input.value.length > maximum) {
            input.value = input.value.slice(0, maximum);
        }
    }

    MainEditor.main();
</script>

</body>
</html>
