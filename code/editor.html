<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Helper for solving sudoku variants" />
    <meta charset="utf-8">
    <title>Sudoku solver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Šimon Brecher">

    <link rel="stylesheet" href="styles/puzzle.css">
    <link rel="stylesheet" href="styles/editor.css">

    <script src="src/editor.js"></script>

    <script src="src/control/builder.js"></script>
    <script src="src/control/renderer.js"></script>
    <script src="src/control/solver.js"></script>

    <script src="src/data/regions.js"></script>
    <script src="src/data/state.js"></script>
    <script src="src/data/sudoku.js"></script>

    <script src="src/graphics/canvas.js"></script>
    <script src="src/graphics/cell.js"></script>
    <script src="src/graphics/frame.js"></script>
    <script src="src/graphics/lineStyle.js"></script>

    <script src="src/utils/arrayUtils.js"></script>
    <script src="src/utils/binaryUtils.js"></script>
    <script src="src/utils/graphicsUtils.js"></script>
    <script src="src/utils/positionUtils.js"></script>
</head>

<body>

<div id="page-wrapper">
    <div id="left-menu" class="menu">
        <div id="menu-button-resize" class="menu-button" onclick="EditorMain.pressedResizeButton();">Resize</div>
        <div id="menu-button-clear" class="menu-button" onclick="EditorMain.pressedClearButton();">Clear</div>
        <div id="menu-button-regions" class="menu-button" onclick="EditorMain.pressedRegionsButton();">Regions</div>
        <div id="menu-button-view" class="menu-button" onclick="EditorMain.pressedViewButton();">View</div>
    </div>
    <div id="container"></div>
    <div id="right-menu" class="menu">
        <section id="menu-section-regions" class="menu-section">
            <div id="menu-button-regions-rectangular" class="menu-button" onclick="EditorMain.pressedRegionsRectangularButton();">Rectangular</div>
            <div id="menu-button-regions-none" class="menu-button" onclick="EditorMain.pressedRegionsNoneButton();">None</div>
            <div id="menu-button-regions-jigsaw" class="menu-button" onclick="EditorMain.pressedRegionsJigsawButton();">Jigsaw</div>
            <div id="menu-button-regions-view" class="menu-button" onclick="EditorMain.pressedRegionsViewButton();">View</div>
        </section>
        <section id="menu-section-view" class="menu-section">
            <div id="menu-button-view-nothing" class="menu-button">...</div>
        </section>
    </div>
</div>

<script>
    EditorMain.main();
</script>

</body>
</html>
