<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Helper for solving sudoku variants" />
    <meta charset="utf-8">
    <title>Sudoku solver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Šimon Brecher">
    <link rel="icon" type="image/x-icon" href="images/favicon.png">

    <link rel="stylesheet" href="styles/debug.css">
    <link rel="stylesheet" href="styles/puzzle.css">

    <script src="src/utils/arrayUtils.js"></script>
    <script src="src/utils/binaryUtils.js"></script>
    <script src="src/utils/graphicsUtils.js"></script>
    <script src="src/utils/positionUtils.js"></script>

    <script src="src/debug.js"></script>

    <script src="src/graphics/basketBorderStyle.js"></script>
    <script src="src/graphics/canvas.js"></script>
    <script src="src/graphics/cell.js"></script>
    <script src="src/graphics/frame.js"></script>
    <script src="src/graphics/lineStyle.js"></script>

    <script src="src/control/builder.js"></script>
    <script src="src/control/renderer.js"></script>
    <script src="src/control/solver.js"></script>

    <script src="src/data/regions.js"></script>
    <script src="src/data/state.js"></script>
    <script src="src/data/sudoku.js"></script>

    <script src="src/strategy/strategy2d.js"></script>
    <script src="src/strategy/perfectMatching.js"></script>

    <script src="src/tests/graphicsTests.js"></script>
    <script src="src/tests/strategyTests.js"></script>
    <script src="src/tests/perfectMatchingTest.js"></script>
</head>

<body>

<div id="test-menu-button" onclick="updateUrlParameter('test', null)">Menu</div>

<div id="test-types">
    <h2>Graphics</h2>
    <div class="test-types">
        <div onclick="updateUrlParameter('test', 'region_class')">Region class</div>
        <div onclick="updateUrlParameter('test', 'builder_solution')">Builder solution</div>
        <div onclick="updateUrlParameter('test', 'builder_task')">Builder task</div>
        <div onclick="updateUrlParameter('test', 'canvas')">Canvas</div>
        <div onclick="updateUrlParameter('test', 'basket_borders')">Basket boarders</div>
        <div onclick="updateUrlParameter('test', 'background_color')">Background color</div>
    </div>
    <h2>Strategies</h2>
    <div class="test-types">
        <div onclick="updateUrlParameter('test', 'naked_single')">Naked single</div>
        <div onclick="updateUrlParameter('test', 'hidden_single')">Hidden single</div>
        <div onclick="updateUrlParameter('test', 'perfect_match')">Perfect matching</div>
        <div onclick="updateUrlParameter('test', 'perfectly_matchable')">Perfectly matchable edges</div>
    </div>
    <h2>Non graphic tests</h2>
    <div class="test-types">
        <div onclick="updateUrlParameter('test', 'debug')">Debug</div>
        <div onclick="updateUrlParameter('test', 'ng_perfect_match')">Perfect matching</div>
    </div>
</div>

<div id="container" class="puzzle-container"></div>

<script>
    function updateUrlParameter(parameterName, value) {
        let url = new URL(window.location.href);
        if (value === null) {
            url.searchParams.delete(parameterName);
        } else {
            url.searchParams.set(parameterName, value);
        }
        window.location.href = url.toString();
    }

    Debug.main();
</script>

</body>
</html>
